# Starts only by hand (Actions > Release > Run workflow, on main). It builds and packages for Windows and Linux, and leaves
# one draft release with both zips: the person starting it tries them with the real client, then publishes the draft,
# which creates the tag. Agents/docs/dev/releases.md
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, without the v (0.1.0, or 0.2.0-beta.1 for a pre-release)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  VERSION: ${{ inputs.version }}
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version and the branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw "releases start from main, not $env:GITHUB_REF" }
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "version '$env:VERSION' is not x.y.z or x.y.z-pre" }
          if (git tag --list "v$env:VERSION") { throw "v$env:VERSION already exists" }
          gh release view "v$env:VERSION" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "a release v$env:VERSION already exists; delete its draft to build it again" }
          $global:LASTEXITCODE = 0

  # Each system's package on its own runner: build-release.ps1 builds for the system it runs on.
  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the package
        shell: pwsh
        run: ./scripts/release/build-release.ps1 -Version $env:VERSION

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/LocalExile-v${{ inputs.version }}-${{ matrix.runtime }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}
          path: |
            artifacts/release/LocalExile-v${{ inputs.version }}-${{ matrix.runtime }}.zip
            artifacts/release/LocalExile-v${{ inputs.version }}-${{ matrix.runtime }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  # One draft with both zips, made only when both built: no release goes out for one system alone.
  release:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/release
          merge-multiple: true

      - name: Create the draft release
        shell: pwsh
        run: |
          .\scripts\release\release-notes.ps1 -Version $env:VERSION -Output artifacts\release\notes.md
          $files = foreach ($runtime in 'win-x64', 'linux-x64') {
              $zip = "artifacts\release\LocalExile-v$env:VERSION-$runtime.zip"
              foreach ($file in $zip, "$zip.sha256") { if (-not (Test-Path $file)) { throw "$file was not built" }; $file }
          }
          $flags = @('--draft', '--target', $env:GITHUB_SHA, '--title', "LocalExile v$env:VERSION", '--notes-file', 'artifacts\release\notes.md')
          if ($env:VERSION -match '-') { $flags += '--prerelease' }
          gh release create "v$env:VERSION" @files @flags
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
