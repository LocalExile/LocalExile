# Starts only by hand (Actions > Release > Run workflow, on main). It builds and packages, and leaves a draft release:
# the person starting it tries the zip with the real client, then publishes the draft, which creates the tag.
# Agents/docs/dev/releases.md
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, without the v (0.1.0, or 0.2.0-beta.1 for a pre-release)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version and the branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw "releases start from main, not $env:GITHUB_REF" }
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "version '$env:VERSION' is not x.y.z or x.y.z-pre" }
          if (git tag --list "v$env:VERSION") { throw "v$env:VERSION already exists" }
          gh release view "v$env:VERSION" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "a release v$env:VERSION already exists; delete its draft to build it again" }
          $global:LASTEXITCODE = 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the package
        shell: pwsh
        run: .\scripts\release\build-release.ps1 -Version $env:VERSION

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/LocalExile-v${{ inputs.version }}-win-x64.zip

      - name: Create the draft release
        shell: pwsh
        run: |
          .\scripts\release\release-notes.ps1 -Version $env:VERSION -Output artifacts\release\notes.md
          $zip = "artifacts\release\LocalExile-v$env:VERSION-win-x64.zip"
          $flags = @('--draft', '--target', $env:GITHUB_SHA, '--title', "LocalExile v$env:VERSION", '--notes-file', 'artifacts\release\notes.md')
          if ($env:VERSION -match '-') { $flags += '--prerelease' }
          gh release create "v$env:VERSION" $zip "$zip.sha256" @flags
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
