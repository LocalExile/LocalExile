
name: Sync official main

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync from official repository
        run: |
          git remote add upstream https://github.com/LocalExile/LocalExile.git
          git fetch upstream main
          git push origin FETCH_HEAD:main
