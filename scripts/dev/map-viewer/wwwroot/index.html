<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地图图块查看器</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><strong>地图图块查看器</strong><span>LOCAL EXILE / MS0</span></div><span id="state">准备就绪</span></header>
<main><aside><form id="form"><label>地图 <input id="area" list="areas" value="1_1_7_2" required><datalist id="areas"></datalist></label><div class="row"><label>种子 <input id="seed" type="number" min="0" max="4294967295" value="1" required></label><label>区域等级 <input id="level" type="number" min="1" max="100" placeholder="默认"></label></div><button type="submit">生成地图</button></form><div class="tabs"><button class="active" data-tab="tiles">图块</button><button data-tab="objects">物体与连接</button></div><div class="filter"><input id="filter" placeholder="筛选名称或路径"><span id="count"></span></div><div id="list"></div></aside>
<section><div class="toolbar"><div><h1 id="title">上层监狱</h1><span id="subtitle">1_1_7_2</span></div><div class="tools"><label><input type="checkbox" id="walk" checked> 通行区域</label><label><input type="checkbox" id="grid" checked> 图块网格</label><label><input type="checkbox" id="markers" checked> 物体</label><button id="fit" title="适应窗口">适应</button></div></div><div id="viewport"><canvas id="map"></canvas><div id="empty">选择地图并生成</div></div><div class="legend"><span><i class="walk"></i>可通行</span><span><i class="blocked"></i>不可通行</span><span><i class="exit"></i>出入口</span><span><i class="object"></i>特殊物体</span><span id="detail">点击图块或标记查看详情</span></div></section></main><script src="/app.js"></script></body></html>
